<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#2b2257">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Hipertúnel</title>

<style>

  .fps { position: fixed; left: 8px; bottom: 8px; z-index: 99; font: 600 12px monospace; color: #fff; background: rgba(0,0,0,.5); padding: 3px 6px; border-radius: 6px; pointer-events: none; }

</head>
